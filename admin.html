<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | عبدالرحيم برير</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { gold: { 400: '#facc15', 500: '#eab308' }, darkBg: '#0b0f17' },
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0b0f17; color: #e2e8f0; }
        .glass-panel { background: rgba(19, 27, 46, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .gold-button { background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%); color: #000; font-weight: bold; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-3xl w-full glass-panel p-8 rounded-3xl border border-gold-500/30 my-8">
        <div class="flex items-center justify-between mb-8 pb-4 border-b border-white/10">
            <h3 class="text-2xl font-bold text-white flex items-center gap-3">
                <i class="fa-solid fa-sliders text-gold-400"></i> لوحة إدارة معرض الأعمال
            </h3>
            <a href="index.html" class="text-sm text-gray-400 hover:text-gold-400 flex items-center gap-2">
                <span>العودة للموقع</span>
                <i class="fa-solid fa-arrow-left"></i>
            </a>
        </div>

        <!-- Password Step -->
        <div id="admin-login-step" class="text-center py-10">
            <i class="fa-solid fa-shield-halved text-5xl text-gold-400 mb-4"></i>
            <h4 class="text-xl font-bold text-white mb-2">تسجيل الدخول لوحة التحكم</h4>
            <p class="text-sm text-gray-400 mb-6">أدخل كلمة المرور (الافتراضية: <span class="text-gold-400 font-mono">1234</span>)</p>
            <div class="flex max-w-xs mx-auto gap-3">
                <input type="password" id="admin-pass" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-center text-white focus:outline-none focus:border-gold-500" placeholder="••••">
                <button onclick="unlockAdmin()" class="gold-button px-6 py-2.5 rounded-xl text-sm">دخول</button>
            </div>
        </div>

        <!-- Dashboard Content -->
        <div id="admin-content-step" class="hidden space-y-8">
            <form id="add-project-form" onsubmit="handleSaveProject(event)" class="space-y-4">
                <h4 class="text-lg font-bold text-gold-400 border-b border-white/10 pb-2">إضافة مشروع جديد</h4>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold mb-2">عنوان المشروع</label>
                        <input type="text" id="proj-title" required class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:border-gold-500">
                    </div>
                                 </div>

                <div>
                    <label class="block text-xs font-semibold mb-2">رابط فيديو YouTube</label>
                    <input type="url" id="proj-url" required class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:border-gold-500" placeholder="https://www.youtube.com/watch?v=...">
                </div>

                <div>
                    <label class="block text-xs font-semibold mb-2">رابط صورة مصغرة (اختياري)</label>
                    <input type="url" id="proj-thumb" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:border-gold-500" placeholder="اتركه فارغاً لاستخراجها من يوتيوب تلقائياً">
                </div>

                <div>
                    <label class="block text-xs font-semibold mb-2">وصف المشروع</label>
                    <textarea id="proj-desc" rows="3" required class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:border-gold-500"></textarea>
                </div>

                <button type="submit" class="gold-button w-full py-3 rounded-xl font-bold">حفظ ونشر المشروع</button>
            </form>

            <div>
                <h4 class="text-lg font-bold text-gold-400 border-b border-white/10 pb-2 mb-4">المشاريع الحالية</h4>
                <div id="admin-projects-list" class="space-y-3 max-h-60 overflow-y-auto pr-2"></div>
            </div>
        </div>
    </div>

    <script>
      const initialProjects = [
            { id: '1', title: 'برنامج تلفزيوني - الحلقة 5', category: 'برامج تلفزيونية', youtubeUrl: 'https://www.youtube.com/watch?v=try3k6tQae0', desc: 'إعداد ومونتاج الحلقة الخامسة مع الضيوف وتنسيق الإيقاع البصري الصوتي.' },
            { id: '2', title: 'تغطية تلفزيونية خاصة', category: 'تقارير وتغطيات', youtubeUrl: 'https://www.youtube.com/watch?v=U8Yl68FY8F8', desc: 'مونتاج سريع لتغطية ميدانية وإعادة صياغة القصص الميدانية.' },
            { id: '3', title: 'وثائقي تلفزيوني سينمائي', category: 'وثائقيات', youtubeUrl: 'https://www.youtube.com/watch?v=3PzKYWdcfZ8', desc: 'تلوين وهندسة صوت ومونتاج وثائقي متكامل بسرد درامي ممتاز.' },
            { id: '4', title: 'تقرير تلفزيوني إخباري', category: 'تقارير وتغطيات', youtubeUrl: 'https://www.youtube.com/watch?v=VPNE_oyzAyQ', desc: 'صياغة الخبر وتنسيق المشاهد بسرعة للتوافق مع جدول البث الإخباري.' },
            { id: '5', title: 'برنامج حواري تلفزيوني', category: 'برامج تلفزيونية', youtubeUrl: 'https://www.youtube.com/watch?v=QDPnt16DStw', desc: 'مونتاج كاميرات متعددة (Multi-cam) مع إضافة المؤثرات والباقات الجرافيكية.' },
            { id: '6', title: 'سلسلة تلفزيونية وثائقية', category: 'وثائقيات', youtubeUrl: 'https://www.youtube.com/watch?v=kXncSE29ZIw', desc: 'سلسلة مخصصة للبث التلفزيوني تبرز جودة التفاصيل البصرية.' }
        ];

        let projects = JSON.parse(localStorage.getItem('abdelrhim_projects')) || initialProjects; 

        function unlockAdmin() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === '1234') {
                document.getElementById('admin-login-step').classList.add('hidden');
                document.getElementById('admin-content-step').classList.remove('hidden');
                renderAdminList();
            } else {
                alert('كلمة المرور غير صحيحة!');
            }
        }

        function renderAdminList() {
            const list = document.getElementById('admin-projects-list');
            list.innerHTML = '';
            projects.forEach((p) => {
                const item = document.createElement('div');
                item.className = 'flex items-center justify-between p-3 rounded-xl bg-gray-900 border border-gray-800 text-sm';
                item.innerHTML = `
                    <div class="font-semibold text-white">${p.title} <span class="text-xs text-gold-400"></span></div>
                    <button onclick="deleteProject('${p.id}')" class="text-red-400 hover:text-red-300 p-2"><i class="fa-solid fa-trash"></i></button>
                `;
                list.appendChild(item);
            });
        }

        function handleSaveProject(e) {
            e.preventDefault();
            const title = document.getElementById('proj-title').value;
           
            const youtubeUrl = document.getElementById('proj-url').value;
            const thumb = document.getElementById('proj-thumb').value;
            const desc = document.getElementById('proj-desc').value;

            const newProj = { id: Date.now().toString(), title, youtubeUrl, thumb, desc };
            projects.unshift(newProj);
            localStorage.setItem('abdelrhim_projects', JSON.stringify(projects));
            renderAdminList();
            document.getElementById('add-project-form').reset();
            alert('تمت إضافة المشروع وحفظه بنجاح!');
        }

        function deleteProject(id) {
            if (confirm('هل أنت تأكد من حذف هذا المشروع؟')) {
                projects = projects.filter(p => p.id !== id);
                localStorage.setItem('abdelrhim_projects', JSON.stringify(projects));
                renderAdminList();
            }
        }
    </script>
</body>
</html>
